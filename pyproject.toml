[project]
name = "finagent"
version = "0.1.0"
description = "Production-grade multi-agent financial decision assistant service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=1.2.4",
  "pydantic>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
production = [
  "neo4j>=5.0",
  "psycopg[binary]>=3.2",
  "pymilvus>=2.4",
  "temporalio>=1.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["finagent/tests"]
